# package.conf -- how the pdk's package.yml builds this repository's SIS files (release.yml): the WebKit engine as a
# web-engine plug-in, which the browser finds once it is installed
NAME=webkit-symbian
ARCHES="arm x32"
IMAGE=ghcr.io/phorepoc/web
# cxxrt: the C++ library; tls: the certificates the engine trusts; webengine: the plug-in interface
REPOS_arm="cxxrt tls webengine"
REPOS_x32="cxxrt tls webengine"
COMPONENTS_arm="phewebengine_webkit_arm"
COMPONENTS_x32="phewebengine_webkit"
